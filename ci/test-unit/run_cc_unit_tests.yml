---
platform: linux
image_resource:
  type: registry-image
  source:
    repository: cloudfoundry/capi
    tag: ruby-units
inputs:
  - name: capi-ci
  - name: cloud_controller_ng
caches:
  - path: cloud_controller_ng/tmp/parallel_rspec_runtime
run:
  path: capi-ci/ci/test-unit/run_cc_unit_tests.sh
params:
  DB: ~
  RUN_IN_PARALLEL: ~
  RUN_RUBOCOP: false
