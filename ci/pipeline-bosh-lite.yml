---
resource_types:
  - name: terraform
    type: docker-image
    source:
      repository: ljfranklin/terraform-resource
  - name: bosh-deployment
    type: docker-image
    source:
      repository: cloudfoundry/bosh-deployment-resource
  - name: gcs-resource
    type: registry-image
    source:
      repository: frodenas/gcs-resource
resources:
  - name: terraform
    type: terraform
    icon: terraform
    source:
      backend_type: gcs
      backend_config:
        bucket: ((bosh_lite_storage_bucket))
        prefix: bosh-lite/
        credentials: ((bosh_lite_gcp_json_key))
  - name: capi-ci
    type: git
    icon: git
    source:
      branch: main
      uri: https://github.com/cloudfoundry/capi-ci.git
  - name: bosh-deployment
    type: git
    icon: git
    source:
      branch: master
      uri: https://github.com/cloudfoundry/bosh-deployment.git
  - name: ready-pool
    type: pool
    icon: cloud-lock-outline
    source:
      branch: main
      uri: git@github.com:cloudfoundry/capi-env-pool.git
      pool: bosh-lites
      private_key: ((pcf_bosh_lite_pool_deploy_key))
      git_config: &pool-git-config
        - name: user.name
          value: ((ari-wg-gitbot-username))
        - name: user.email
          value: ((ari-wg-gitbot-email))
  - name: broken-pool
    type: pool
    icon: cloud-lock-outline
    source:
      branch: main
      uri: git@github.com:cloudfoundry/capi-env-pool.git
      pool: broken-bosh-lites
      private_key: ((pcf_bosh_lite_pool_deploy_key))
      git_config: *pool-git-config
  - name: building-pool
    type: pool
    icon: cloud-lock-outline
    source:
      branch: main
      uri: git@github.com:cloudfoundry/capi-env-pool.git
      pool: building-bosh-lites
      private_key: ((pcf_bosh_lite_pool_deploy_key))
      git_config: *pool-git-config
  - name: pool-repo
    type: git
    icon: git
    source:
      branch: main
      uri: git@github.com:cloudfoundry/capi-env-pool.git
      private_key: ((pcf_bosh_lite_pool_deploy_key))
  - name: create-bosh-lite-trigger
    type: git
    icon: git
    source:
      branch: main
      uri: git@github.com:cloudfoundry/capi-env-pool.git
      private_key: ((pcf_bosh_lite_pool_deploy_key))
      paths:
        - .trigger-bosh-lites-create # updated by check-pool-size
  - name: cf-deployment
    type: git
    icon: git
    source:
      branch: release-candidate
      uri: https://github.com/cloudfoundry/cf-deployment.git
  - name: cf-deploy
    type: bosh-deployment
    icon: cloud-upload-outline
    source:
      skip_check: true
  - name: one-hour
    type: time
    icon: clock-outline
    source:
      interval: 1h
  - name: weekly
    type: time
    icon: clock-outline
    source:
      location: America/Los_Angeles
      start: 01:00
      stop: 02:00
      days:
        - Saturday
  - name: cloud_controller_ng
    type: git
    icon: git
    source:
      uri: https://github.com/cloudfoundry/cloud_controller_ng.git
      branch: main
      username: ((ari-wg-gitbot-username))
      password: ((ari-wg-gitbot-token))
  # Needs the commit that lets the suite target a plain-HTTP endpoint, so this
  # job only works once that has landed on main.
  - name: capi-bara-tests
    type: git
    icon: git
    source:
      uri: https://github.com/cloudfoundry/capi-bara-tests.git
      branch: main
      username: ((ari-wg-gitbot-username))
      password: ((ari-wg-gitbot-token))
  - name: openapi-traffic-har
    type: gcs-resource
    icon: google-cloud
    source:
      bucket: capi-openapi-validation
      regexp: traffic-(.*).har.gz
      json_key: ((capi-release-blobs-uploader_key))
jobs:
  - name: create-bosh-lite
    plan:
      - in_parallel:
          steps:
            - get: capi-ci
            - get: bosh-deployment
            - get: cf-deployment
            - get: create-bosh-lite-trigger
              trigger: true
      - task: generate-fake-env-for-building-pool
        file: capi-ci/ci/bosh-lite/generate-fake-env-for-building-pool.yml
      - put: building-pool
        params:
          add_claimed: fake-placeholder-env/
      - do:
          - task: name-bosh-lite
            file: capi-ci/ci/bosh-lite/name-bosh-lite.yml
          - put: terraform
            params:
              env_name_file: env-name/env-name
              delete_on_failure: true
              terraform_source: capi-ci/terraform/bosh-lite/
              vars: &terraform-vars
                project_id: ((bosh_lite_project_id))
                json_key: ((bosh_lite_gcp_json_key))
                dns_project_id: ((dns_gcp_project_id))
                dns_json_key: ((dns_gcp_json_key))
                system_domain_suffix: ((bosh_lite_system_domain_suffix))
                dns_zone_name: ((bosh_lite_dns_zone_name))
          - task: create-bosh-lite
            file: capi-ci/ci/bosh-lite/create-bosh-lite.yml
            params:
              GCP_JSON_KEY: ((bosh_lite_gcp_json_key))
          - do:
              - task: create-env-vars-file
                file: capi-ci/ci/bosh-lite/create-env-vars-file.yml
              - task: upload-cf-assets
                file: capi-ci/ci/bosh-lite/upload-cf-assets.yml
              - task: write-bosh-target-file
                file: capi-ci/ci/bosh-lite/write-bosh-target-file.yml
              - put: cf-deploy
                params:
                  source_file: bosh-target/target.yml
                  manifest: cf-deployment/cf-deployment.yml
                  vars_files:
                    - bosh-target/vars.yml
                  ops_files:
                    - capi-ci/cf-deployment-operations/use-latest-stemcell.yml
                    - cf-deployment/operations/bosh-lite.yml
                    - cf-deployment/operations/use-compiled-releases.yml
                    - capi-ci/cf-deployment-operations/seed-credhub-asg.yml
              - task: upload-to-gcs
                file: capi-ci/ci/gcs/upload-to-gcs.yml
                input_mapping:
                  environment: terraform
                  source-directory: director-state
                params:
                  GCP_JSON_KEY: ((bosh_lite_gcp_json_key))
                  GCP_BUCKET: ((bosh_lite_storage_bucket))
                  GCP_PATH: director-state
                  USE_ENV_NAMED_SUBDIR: true
              - put: ready-pool
                params:
                  add: bosh-lite-env-info/
              - put: building-pool
                params:
                  remove: fake-placeholder-env/
            on_failure:
              in_parallel:
                steps:
                  - put: building-pool
                    params:
                      remove: fake-placeholder-env/
                  - task: delete-bosh-lite
                    file: capi-ci/ci/bosh-lite/delete-bosh-lite.yml
        on_failure:
          in_parallel:
            steps:
              - put: terraform
                params:
                  action: destroy
                  env_name_file: terraform/name
                  terraform_source: capi-ci/terraform/bosh-lite/
                  vars: *terraform-vars
                get_params:
                  action: destroy
              - put: building-pool
                params:
                  remove: fake-placeholder-env/
  - name: delete-bosh-lite
    plan:
      - in_parallel:
          steps:
            - get: capi-ci
            - get: bosh-deployment
            - get: broken-pool
              passed:
                - check-broken-pool-size
              trigger: true
      - do:
          - task: download-from-gcs
            file: capi-ci/ci/gcs/download-from-gcs.yml
            input_mapping:
              environment: broken-pool
            output_mapping:
              destination-directory: director-state
            params:
              GCP_JSON_KEY: ((bosh_lite_gcp_json_key))
              GCP_BUCKET: ((bosh_lite_storage_bucket))
              GCP_PATH: director-state
              USE_ENV_NAMED_SUBDIR: true
          - task: delete-bosh-lite
            file: capi-ci/ci/bosh-lite/delete-bosh-lite.yml
          - put: terraform
            params:
              action: destroy
              env_name_file: broken-pool/name
              terraform_source: capi-ci/terraform/bosh-lite/
              vars: *terraform-vars
            get_params:
              action: destroy
          - task: delete-from-gcs
            file: capi-ci/ci/gcs/delete-from-gcs.yml
            input_mapping:
              environment: broken-pool
            params:
              GCP_JSON_KEY: ((bosh_lite_gcp_json_key))
              GCP_BUCKET: ((bosh_lite_storage_bucket))
              GCP_PATH: director-state
              USE_ENV_NAMED_SUBDIR: true
          - put: broken-pool
            params:
              remove: broken-pool/
        on_failure:
          put: broken-pool
          params:
            release: broken-pool/
  - name: check-pool-size
    build_logs_to_retain: 100
    plan:
      - in_parallel:
          steps:
            - get: capi-ci
            - get: pool-repo
            - get: one-hour
              trigger: true
      - task: check-pool-size
        file: capi-ci/ci/bosh-lite/check-pool-size.yml
        input_mapping:
          env-pool: pool-repo
        params:
          MIN_UNCLAIMED_COUNT: 1
          GIT_USERNAME: ((ari-wg-gitbot-username))
          GIT_EMAIL: ((ari-wg-gitbot-email))
      - put: pool-repo
        params:
          repository: updated-env-pool
          rebase: true
  - name: check-broken-pool-size
    build_logs_to_retain: 100
    plan:
      - in_parallel:
          steps:
            - get: capi-ci
            - get: pool-repo
            - get: one-hour
              trigger: true
      - try:
          task: check-broken-pool-size
          file: capi-ci/ci/bosh-lite/check-broken-pool-size.yml
          input_mapping:
            env-pool: pool-repo
          on_success:
            put: broken-pool
            params:
              acquire: true
  - name: openapi-record-har
    serial: true
    plan:
      - in_parallel:
          steps:
            - get: weekly
              trigger: true
            - get: capi-ci
            - get: cloud_controller_ng
            - get: capi-bara-tests
            - get: ready-pool
              params:
                acquire: true
      - do:
          - task: record-traffic
            file: capi-ci/ci/openapi/record-traffic.yml
            timeout: 3h
            input_mapping:
              bosh-lite-env: ready-pool
              cloud-controller-ng: cloud_controller_ng
              acceptance-tests: capi-bara-tests
            params:
              TEST_SUITE: capi-bara-tests
              THREADS: 4
              HAR_MAX_PER_KEY: 3
        ensure:
          do:
            # Publish first: a partial corpus from an interrupted run still
            # beats no corpus, and the recorder flushes on cleanup.
            - put: openapi-traffic-har
              params:
                file: compliance-report/traffic-*.har.gz
            - put: ready-pool
              params:
                release: ready-pool
